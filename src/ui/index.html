<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQLite Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #ffffff;
        --bg-hover: #f1f1f0;
        --bg-active: #e8e8e6;
        --sidebar-bg: #fbfbfa;
        --border: #e8e8e6;
        --text: #37352f;
        --text-secondary: #787774;
        --accent: #2eaadc;
        --red: #eb5757;
        --green: #4daa57;
      }

      [data-theme="dark"] {
        --bg: #191919;
        --bg-hover: #252525;
        --bg-active: #303030;
        --sidebar-bg: #202020;
        --border: #333333;
        --text: #e8e8e6;
        --text-secondary: #9b9a97;
        --accent: #529cca;
        --red: #e16259;
        --green: #4daa57;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        font-size: 14px;
        line-height: 1.5;
      }

      /* Sidebar - Notion Style */
      .sidebar {
        width: 240px;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }

      .logo i {
        color: var(--accent);
      }

      .icon-btn {
        width: 28px;
        height: 28px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
      }

      .sidebar-search {
        margin: 0 8px 8px;
        padding: 6px 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-size: 13px;
        width: calc(100% - 16px);
      }

      .sidebar-search::placeholder {
        color: var(--text-secondary);
      }

      .nav-section {
        padding: 4px 8px;
      }

      .nav-item {
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--text-secondary);
        transition: all 0.1s;
      }

      .nav-item:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--bg-active);
        color: var(--text);
      }
      .nav-item i {
        font-size: 16px;
      }

      .nav-item .badge {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .nav-title {
        padding: 16px 10px 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .tables-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px;
      }

      /* Main */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Toolbar */
      .toolbar {
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toolbar-btn {
        padding: 5px 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        font-family: inherit;
      }

      .toolbar-btn:hover {
        background: var(--bg-hover);
      }
      .toolbar-btn.primary {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .toolbar-btn.primary:hover {
        opacity: 0.9;
      }

      .spacer {
        flex: 1;
      }

      .page-info {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-secondary);
      }

      .page-input {
        width: 45px;
        padding: 4px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        text-align: center;
        font-size: 13px;
      }

      /* Query Area */
      .query-area {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: none;
      }

      .query-area.show {
        display: block;
      }

      .query-input {
        width: 100%;
        min-height: 100px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 13px;
        resize: vertical;
        margin-bottom: 12px;
      }

      .query-input:focus {
        outline: none;
        border-color: var(--accent);
      }

      /* Table */
      .table-container {
        flex: 1;
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 8px 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }

      th {
        background: var(--sidebar-bg);
        font-weight: 500;
        color: var(--text-secondary);
        position: sticky;
        top: 0;
        cursor: pointer;
        white-space: nowrap;
      }

      th:hover {
        color: var(--text);
      }

      tbody tr:hover {
        background: var(--bg-hover);
      }

      .null {
        color: var(--text-secondary);
        font-style: italic;
      }

      .row-actions {
        opacity: 0;
        display: flex;
        gap: 4px;
      }

      tr:hover .row-actions {
        opacity: 1;
      }

      .delete-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
      }

      .delete-btn:hover {
        background: var(--bg-active);
        color: var(--red);
      }

      /* Empty State */
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-secondary);
      }

      .empty i {
        font-size: 48px;
        opacity: 0.3;
        margin-bottom: 12px;
      }

      /* Modal */
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .modal-bg.show {
        display: flex;
      }

      .modal {
        background: var(--bg);
        border-radius: 8px;
        width: 420px;
        max-height: 80vh;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }

      .modal-header {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
      }

      .modal-body {
        padding: 16px;
        overflow-y: auto;
        max-height: 50vh;
      }

      .field {
        margin-bottom: 12px;
      }

      .field label {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }

      .field input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }

      .field input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .modal-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .btn {
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        font-family: inherit;
      }

      .btn-cancel {
        background: var(--bg-hover);
        border: 1px solid var(--border);
        color: var(--text);
      }
      .btn-save {
        background: var(--accent);
        border: none;
        color: white;
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 12px 16px;
        border-radius: 6px;
        color: white;
        font-size: 14px;
        z-index: 200;
        display: none;
      }

      .toast.error {
        background: var(--red);
      }
      .toast.success {
        background: var(--green);
      }
      .toast.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="ti ti-database"></i>
          <span>SQLite Admin</span>
        </div>
        <button class="icon-btn" id="themeToggle" title="Alternar Tema">
          <i class="ti ti-moon"></i>
        </button>
      </div>

      <div class="nav-section">
        <div class="nav-item" id="sqlRunnerBtn">
          <i class="ti ti-terminal-2"></i>
          <span>SQL Runner</span>
        </div>
      </div>

      <div class="nav-title">Tabelas</div>
      <div class="tables-list" id="tablesList"></div>
    </aside>

    <main class="main">
      <div class="toolbar" id="toolbar">
        <button class="toolbar-btn primary" id="addBtn">
          <i class="ti ti-plus"></i> Novo
        </button>
        <button class="toolbar-btn" id="refreshBtn">
          <i class="ti ti-refresh"></i>
        </button>
        <div class="spacer"></div>
        <div class="page-info">
          <span id="countInfo">0 registros</span>
          <button class="icon-btn" id="prevBtn">
            <i class="ti ti-chevron-left"></i>
          </button>
          <input
            type="number"
            class="page-input"
            id="pageInput"
            value="1"
            min="1"
          />
          <button class="icon-btn" id="nextBtn">
            <i class="ti ti-chevron-right"></i>
          </button>
        </div>
      </div>

      <div class="query-area" id="queryArea">
        <textarea
          class="query-input"
          id="queryInput"
          placeholder="SELECT * FROM tabela"
        ></textarea>
        <button class="toolbar-btn primary" id="runBtn">
          <i class="ti ti-player-play"></i> Executar
        </button>
      </div>

      <div class="table-container" id="tableContainer">
        <div class="empty">
          <i class="ti ti-table"></i>
          <p>Selecione uma tabela</p>
        </div>
      </div>
    </main>

    <div class="modal-bg" id="modal">
      <div class="modal">
        <div class="modal-header">
          <span>Novo Registro</span>
          <button class="icon-btn" id="closeModal">
            <i class="ti ti-x"></i>
          </button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button class="btn btn-cancel" id="cancelBtn">Cancelar</button>
          <button class="btn btn-save" id="saveBtn">Salvar</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
